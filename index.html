<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turf Booking System - Player Module</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .module {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h2 {
            color: #333;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
        button {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Player Turf Management System</h1>

<!-- 1. Book Turf Slot -->
<div class="module">
    <h2>Book Turf Slot</h2>
    <input type="text" placeholder="Enter Turf Name">
    <input type="date">
    <input type="time">
    <button>Book Slot</button>
</div>

<!-- 2. Cancel Booking -->
<div class="module">
    <h2>Cancel Booking</h2>
    <input type="text" placeholder="Enter Booking ID">
    <button>Cancel Booking</button>
</div>

<!-- 3. Reschedule Booking -->
<div class="module">
    <h2>Reschedule Booking</h2>
    <input type="text" placeholder="Booking ID">
    <input type="date">
    <input type="time">
    <button>Reschedule</button>
</div>

<!-- 4. Track Booking Status -->
<div class="module">
    <h2>Track Booking Status</h2>
    <input type="text" placeholder="Booking ID">
    <button>Check Status</button>
    <p>Status: Pending / Confirmed / Cancelled</p>
</div>

<!-- 5. View Match History -->
<div class="module">
    <h2>Match History</h2>
    <ul>
        <li>Match 1 - 01 May 2026 - Win</li>
        <li>Match 2 - 03 May 2026 - Loss</li>
    </ul>
</div>

<!-- 6. Rate Turf Service -->
<div class="module">
    <h2>Rate Turf Service</h2>
    <input type="text" placeholder="Turf Name">
    <input type="number" min="1" max="5" placeholder="Rating (1-5)">
    <button>Submit Rating</button>
</div>

<!-- 7. Update Rating -->
<div class="module">
    <h2>Update Rating</h2>
    <input type="text" placeholder="Rating ID">
    <input type="number" min="1" max="5" placeholder="New Rating">
    <button>Update Rating</button>
</div>

<!-- 8. Delete Rating -->
<div class="module">
    <h2>Delete Rating</h2>
    <input type="text" placeholder="Rating ID">
    <button>Delete Rating</button>
</div>

</body>
</html>
